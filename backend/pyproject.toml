[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sts2-run-coach"
version = "0.1.0"
description = "Read-only Slay the Spire 2 diagnostic adapter and route-coach tools"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
sts2-coach = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]
